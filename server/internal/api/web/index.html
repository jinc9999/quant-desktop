<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超能战士 · 客户管理系统</title>
  <link rel="stylesheet" href="/vendor/element-plus.css" />
  <style>
    html, body, #app { height: 100%; margin: 0; background: #f5f7fa; }
    .login-wrap {
      height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
    }
    .login-card { width: 360px; background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
    .login-title { text-align: center; margin-bottom: 24px; }
    .login-title h1 { font-size: 22px; margin: 0 0 4px; color: #111827; }
    .login-title p { margin: 0; color: #6b7280; font-size: 13px; }
    .main-wrap { height: 100%; }
    .el-header { background: #111827; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .el-header h1 { font-size: 16px; margin: 0; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .content { padding: 16px; }
    .page-bar { margin-top: 12px; display: flex; justify-content: flex-end; }
    .muted { color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/axios.min.js"></script>
  <script src="/vendor/dayjs.min.js"></script>
  <script src="/vendor/element-plus.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
