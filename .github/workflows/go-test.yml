name: Go 回归测试

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: 安装 gcc（CGO sqlite 依赖）
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: 核心业务包单测
        # 排除 internal/bindings（依赖 wails v3，Linux 下需 GTK/WebKit 系统库，编译易卡住；
        # 其测试已在本机 Windows 全量验证）。核心策略/委托/行情/存储逻辑全覆盖。
        run: go test -count=1 -timeout 8m ./internal/strategy/ ./internal/order/ ./internal/binance/ ./internal/storage/ ./internal/risk/ ./internal/license/
      - name: 回测引擎编译
        run: go build -o /dev/null ./backtest/cmd/backtest
