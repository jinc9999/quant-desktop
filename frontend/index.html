<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>pure-admin-thin</title>
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="app">
      <style>
        html,
        body,
        #app {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #0b0e14;
          color: #e6e8ec;
          font-family: "Microsoft YaHei", system-ui, sans-serif;
        }

        .brand-splash {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          animation: splash-fade 0.8s ease-out;
        }

        .brand-logo {
          display: flex;
          gap: 8px;
        }

        .brand-logo .tile {
          width: 42px;
          height: 42px;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .brand-logo .tile-a {
          background: #f0a93b;
        }

        .brand-logo .tile-b {
          background: #3b82f6;
        }

        .brand-title {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 2px;
        }

        .brand-sub {
          font-size: 12px;
          color: #848e9c;
        }

        .brand-progress {
          width: 220px;
          height: 3px;
          border-radius: 2px;
          background: #1e2430;
          overflow: hidden;
          margin-top: 4px;
        }

        .brand-progress-bar {
          height: 100%;
          width: 40%;
          border-radius: 2px;
          background: linear-gradient(90deg, #f0a93b, #3b82f6);
          animation: brand-load 1.2s ease-in-out infinite;
        }

        @keyframes brand-load {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(350%);
          }
        }

        @keyframes splash-fade {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      </style>
      <div class="brand-splash">
        <div class="brand-logo">
          <div class="tile tile-a">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M13.8 3.5 L5.5 13.8 L9.8 13.8 L7.8 20.5 L16.8 9.5 L12.2 9.5 Z"
                fill="#fff"
              />
            </svg>
          </div>
          <div class="tile tile-b">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M6 5.5 L18 5.5 L18 12 L15.5 18 L12 21 L8.5 18 L6 12 Z"
                fill="#fff"
              />
            </svg>
          </div>
        </div>
        <div class="brand-title">量化交易客户端</div>
        <div class="brand-sub">币安合约 · 魔力进攻 A / 稳健 B</div>
        <div class="brand-progress"><div class="brand-progress-bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
